<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <label for="sid">Student Name</label>
        <input type="text" required placeholder="enter your name" id="sid"/><br/>
        <label for="fid">Father Name</label>
        <input type="text" required placeholder="enter your fathers name" id="fid"/><br/>
        <label for="mail">Email</label>
        <input type="email" required id="mail" placeholder="enter your mail"/><br/>
        <label for="phn">Phone number</label>
        <input type="tel" required id="phn" placeholder="enter your phone number"><br/>
        <label for="sel">Gender</label>
        <input type="radio" id="sel" name="male">Male</input>
        <input type="radio" id="sel" name="male">Female</input>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
