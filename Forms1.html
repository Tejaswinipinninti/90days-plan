<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <fieldset>
        <legend>Employee Details</legend>
        <label for="name">First Name</label>
        <input type="text" id="name" name="text"><br/>
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="text"><br/>
        <label for="gender">Gender</label>
        <input type="radio" id="gender" name="gender">Female
        <input type="radio" id="gender" name="gender">Male<br/>
        <label for="empid">Employee Id</label>
        <input type="number"id="empid" name="employee"><br/>
        <label for="desig">Designation</label>
        <input type="text" id="desig"name="role"><br/>
        <label for="phn">Phone Number</label>
        <input type="tel"id="phn"name="phone"><br/>
        <label for="sub">submit</label>
        <input type="button"id="sub"name="submit">
        </fieldset>

        
    </form>
</body>
</html>
