<!doctype html>
<html lang="en">

<head>

  <title>Table</title>
</head>

        <th colspan="2">Subjects</th>

      <tr>
        <th>Theory</th>
        <th>Practical</th>
      </tr>

    </thead>

    <tbody>

      <tr>
        <td>Tuesday</td>
        <td>Science</td>
        <td>Social</td>
      </tr>

      <tr>
        <td>Wednesday</td>
        <td>Maths</td>
        <td>English</td>
      </tr>

    </tbody>

  </table>

</body>

</html>
